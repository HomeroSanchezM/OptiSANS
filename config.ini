# ============================================
# Genetic Algorithm Configuration
# ============================================
#Usage example : 
#	python GA.py <Config.ini>
#	python GA.py -g 50 -p 100 -e 3 -m 0.15 -c 0.8 -v 10

[POPULATION]
# MUST be a multiple of 3
population_size = 6

# elitism ≤ population_size / 3
elitism = 2

# D2O variation amplitude (0–100)
d2o_variation_rate = 5


[GENETIC]
# Probability in [0.0, 1.0]
mutation_rate = 0.15
crossover_rate = 0.8


[EXECUTION]
# Number of generations (>= 1)
generations = 1

# Random seed (leave empty for random behavior)
seed = 1
# early-stoping parameter
patience = 50


# ============================================
# Amino Acid Deuteration Restrictions
# Order MUST match AMINO_ACIDS list
# ============================================

[RESTRICTIONS]
ALA = true
ARG = true
ASN = true
ASP = true
CYS = true
GLU = true
GLN = true
GLY = true
HIS = true
ILE = true
LEU = true
LYS = true
MET = true
PHE = true
PRO = true
SER = true
THR = true
TRP = true
TYR = true
VAL = true


# ============================================
# DeuterPDB engine (integre dans OptiSANS)
# ============================================
# Toutes les sections sont optionnelles : absentes, ces memes valeurs
# s'appliquent. Les paires liees (ASN+ASP, GLU+GLN) partagent un seul gene.

[DEUTERPDB]
policy_file =                # optionnel : policy YAML explicite (prioritaire)
write_report = false         # trace par atome + agregats + provenance (lourd en GA)

[DEUTERPDB.TEMPLATE]
protonation = auto           # never | always | auto (auto ajoute les H si absents)
force_field = amber99sb-ildn
strip_water_ligand = true    # retire HOH et ligands (HETATM)
model =                      # index de modele, requis si PDB multi-modele

[DEUTERPDB.LABILITY]
cutoff_angstrom = 1.4
ambiguity_tolerance = 0.25
quarantine = warn

[DEUTERPDB.ACCESSIBILITY]
enabled = false              # requis pour les modes kinetic et dual
granularity = residue          # residue (OU par AA, defaut) | atom (comportement historique)
sasa_probe = 1.4
sasa_n_points = 92
threshold_angstrom2 = 5.0
threshold_mode = absolute
use_hbond_protection = false
hbond_max_h_o = 2.5
hbond_min_angle = 120.0

[DEUTERPDB.LABILE_EXCHANGE]
mode = simple
sampling = exact
rounding = floor
seed = 42
probability_burried =

[DEUTERPDB.KINETIC]
accessible_rate = 1.0
buried_rate = 0.01
time_minutes = 60.0
buried_fraction_source = sasa
buried_fraction =

