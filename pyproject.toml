[project]
authors = [{name = "Homero", email = "homerosanchez1803@gmail.com"}]
dependencies = ["gemmi>=0.7.4,<0.8"]
name = "Python_project"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
optisans = "src.cli:main"
deuterpdb = "src.deuterpdb.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
# Marks of the vendored DeuterPDB test suite (tests/deuterpdb).
markers = [
    "slow: long integration tests (gromacs, Biopython, legacy OptiSANS, Pepsi-SANS)",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
optisans = "optisans"
test-deuterpdb = "pytest -q tests/deuterpdb"
test-deuterpdb-slow = "pytest -q -m slow tests/deuterpdb"

[tool.pixi.pypi-dependencies]
python_project = { path = ".", editable = true }
typer = ">=0.12,<1"

[tool.pixi.dependencies]
numpy = ">=2.4.1,<3"
dataclasses = ">=0.8,<0.9"
biopython = ">=1.86,<2"
gromacs = ">=2026.0,<2027"
scipy = ">=1.17.0,<2"
matplotlib = ">=3.10.8,<4"
pdbfixer = ">=1.12,<2"
openmm = ">=8.4.0,<9"
parallel = ">=20260122,<20260123"
pandas = ">=3.0.1,<4"
# DeuterPDB integre (copie vendorisee) : pyyaml pour la policy, pytest pour ses tests
pyyaml = ">=6,<7"
pytest = ">=8,<9"

[tool.pixi.environments]
docs = { features = ["docs"] }

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.3,<9"
sphinx-rtd-theme = ">=3.1.0,<4"
